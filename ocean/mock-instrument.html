<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EL-SYSTEMA ─ mock-instrument</title>
  <style>
    :root {
      --bg: #0e0d0b;
      --panel: #15140f;
      --line: #2a261d;
      --text: #d8d6cf;
      --dim: #7a7468;
      --accent: #b89464;
      --green: #7cb38a;
      --red: #c06f62;
      --gray: #6a655d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: radial-gradient(circle at top, #17140f 0%, var(--bg) 60%);
      color: var(--text);
      font: 13px/1.6 ui-monospace, "SFMono-Regular", "DejaVu Sans Mono", monospace;
      padding: 20px;
    }
    .shell {
      max-width: 860px;
      margin: 0 auto;
      border: 1px solid var(--line);
      background: rgba(21, 20, 15, 0.92);
    }
    .head, .block { border-bottom: 1px solid var(--line); }
    .head {
      padding: 16px 18px;
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.12em;
    }
    .meta {
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      color: var(--dim);
    }
    .lamp {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--gray);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
    }
    .dot.on { background: var(--green); box-shadow: 0 0 12px rgba(124,179,138,0.45); }
    .dot.off { background: var(--gray); }
    .dot.err { background: var(--red); box-shadow: 0 0 12px rgba(192,111,98,0.45); }
    .block { padding: 14px 18px; }
    .title {
      margin: 0 0 10px 0;
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    button {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      padding: 7px 12px;
      cursor: pointer;
      font: inherit;
      letter-spacing: 0.08em;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    label {
      display: grid;
      grid-template-columns: 110px minmax(120px, 1fr) 70px;
      gap: 10px;
      align-items: center;
      margin: 8px 0;
      color: var(--dim);
    }
    input[type="range"] { width: 100%; }
    .hint { color: var(--dim); margin-top: 10px; }
    .meter {
      flex: 1;
      min-width: 180px;
      height: 10px;
      border: 1px solid var(--line);
      background: #0f0d09;
      position: relative;
      overflow: hidden;
    }
    .meter > span {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      background: linear-gradient(90deg, #5e7c67 0%, #b89464 100%);
    }
    .stack {
      display: grid;
      gap: 12px;
    }
    pre {
      margin: 0;
      padding: 12px;
      min-height: 120px;
      max-height: 280px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid var(--line);
      background: #11100c;
    }
    .footer {
      padding: 12px 18px;
      color: var(--dim);
      font-size: 12px;
    }
    @media (max-width: 640px) {
      label { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="head">
      <div>
        <h1>mock-instrument</h1>
        <div class="hint">id = <strong>mock-instrument</strong></div>
      </div>
      <div class="meta">
        <span class="lamp"><span class="dot off" id="connDot"></span><span id="connText">未接続</span></span>
        <span id="wsUrl">ws://localhost:8787</span>
      </div>
    </div>

    <div class="block">
      <p class="title">鳴る / 止む</p>
      <div class="row">
        <button id="unlockBtn">Unlock Audio</button>
        <button id="startBtn">Start</button>
        <button id="stopBtn">Stop</button>
      </div>
      <div class="hint" id="audioState">AudioContext: 未生成</div>
    </div>

    <div class="block stack">
      <div>
        <p class="title">送る kehai</p>
        <div class="row">
          <span id="kehaiSim">●sim</span>
          <div class="meter"><span id="presenceBar"></span></div>
          <span id="presenceText">0.000</span>
        </div>
      </div>
      <div>
        <label>master
          <input type="range" id="masterGain" min="0" max="1" step="0.01" value="0.18" />
          <span id="masterGainV">0.18</span>
        </label>
        <label>cutoff
          <input type="range" id="cutoff" min="0.02" max="1" step="0.01" value="0.50" />
          <span id="cutoffV">0.50</span>
        </label>
        <label>noise
          <input type="range" id="noiseLevel" min="0" max="1" step="0.01" value="0.25" />
          <span id="noiseLevelV">0.25</span>
        </label>
      </div>
    </div>

    <div class="block">
      <p class="title">受け取った御題（最新 20 件）</p>
      <pre id="received">まだ受信はありません。</pre>
    </div>

    <div class="block">
      <p class="title">状態の snapshot</p>
      <pre id="snapshot"></pre>
    </div>

    <div class="footer">
      `play / stop / setParam / ramp / loadPreset / snapshot` をすべて受ける mock 試験器。
    </div>
  </div>

  <script src="shared/el-systema-shapes.js"></script>
  <script src="shared/el-systema-transport.js"></script>
  <script src="shared/el-systema-control.js"></script>
    <script src="./shared/el-systema-assr.js"></script>
  <script>
    (function () {
      "use strict";

      if (typeof window.registerElSystemaInstrument !== "function") {
        window.registerElSystemaInstrument = function () {};
      }

      const id = "mock-instrument";
      const wsUrl = "ws://127.0.0.1:8787";
      const receivedEl = document.getElementById("received");
      const snapshotEl = document.getElementById("snapshot");
      const connDot = document.getElementById("connDot");
      const connText = document.getElementById("connText");
      const wsUrlEl = document.getElementById("wsUrl");
      const audioStateEl = document.getElementById("audioState");
      const presenceBar = document.getElementById("presenceBar");
      const presenceText = document.getElementById("presenceText");
      const kehaiSim = document.getElementById("kehaiSim");

      const masterGainEl = document.getElementById("masterGain");
      const masterGainV = document.getElementById("masterGainV");
      const cutoffEl = document.getElementById("cutoff");
      const cutoffV = document.getElementById("cutoffV");
      const noiseLevelEl = document.getElementById("noiseLevel");
      const noiseLevelV = document.getElementById("noiseLevelV");

      let ac = null;
      let master = null;
      let voiceGain = null;
      let filter = null;
      let noiseSrc = null;
      let relay = null;
      let kehaiPoll = null;
      let transport = null;
      const inflightRamps = {};

      const received = [];
      const params = {
        master: +masterGainEl.value,
        masterGain: +masterGainEl.value,
        cutoff: +cutoffEl.value,
        noiseLevel: +noiseLevelEl.value,
      };

      wsUrlEl.textContent = wsUrl;

      function clamp(n, min, max) {
        n = Number(n);
        if (!isFinite(n)) return min;
        return Math.max(min, Math.min(max, n));
      }

      function stamp() {
        return new Date().toLocaleTimeString("ja-JP", { hour12: false });
      }

      function renderReceived() {
        if (!received.length) {
          receivedEl.textContent = "まだ受信はありません。";
          return;
        }
        receivedEl.textContent = received.map(function (entry) {
          return "▸ " + entry.label + " " + JSON.stringify(entry.payload) + " at " + entry.at;
        }).join("\n");
      }

      function refreshSnapshot() {
        snapshotEl.textContent = JSON.stringify(makeSnapshot(), null, 2);
      }

      function logReceived(label, payload) {
        received.unshift({ label: label, payload: payload, at: stamp() });
        if (received.length > 20) received.length = 20;
        renderReceived();
        refreshSnapshot();
      }

      function setConnection(state, text) {
        connDot.className = "dot " + state;
        connText.textContent = text;
      }

      function updateAudioState() {
        if (!ac) {
          audioStateEl.textContent = "AudioContext: 未生成";
          return;
        }
        audioStateEl.textContent = "AudioContext: " + ac.state + (noiseSrc ? " / playing" : " / stopped");
      }

      function normToHz(v) {
        return Math.round(200 + Math.pow(clamp(v, 0, 1), 1.6) * 6200);
      }

      function setMaster(v) {
        const n = clamp(v, 0, 1);
        params.master = n;
        params.masterGain = n;
        masterGainEl.value = String(n);
        masterGainV.textContent = n.toFixed(2);
        if (master) master.gain.value = n;
      }

      function setCutoff(v) {
        const n = clamp(v, 0.02, 1);
        params.cutoff = n;
        cutoffEl.value = String(n);
        cutoffV.textContent = n.toFixed(2);
        if (filter) filter.frequency.value = normToHz(n);
      }

      function setNoiseLevel(v) {
        const n = clamp(v, 0, 1);
        params.noiseLevel = n;
        noiseLevelEl.value = String(n);
        noiseLevelV.textContent = n.toFixed(2);
        if (voiceGain) voiceGain.gain.value = n * 0.2;
      }

      function setParam(name, value) {
        params[name] = value;
        if (name === "master" || name === "masterGain") {
          setMaster(value);
          return;
        }
        if (name === "cutoff") {
          setCutoff(value);
          return;
        }
        if (name === "noise" || name === "noiseLevel") {
          setNoiseLevel(value);
          return;
        }
      }

      function ensureAudio() {
        if (ac) return;
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain();
        master.gain.value = params.master;
        voiceGain = ac.createGain();
        voiceGain.gain.value = params.noiseLevel * 0.2;
        filter = ac.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = normToHz(params.cutoff);
        voiceGain.connect(filter);
        filter.connect(master);
        master.connect(ac.destination);

        transport = ElSystemaTransport.createTransport({ kind: "ws", url: wsUrl });
        transport.onOpen(function () { setConnection("on", "接続"); });
        transport.onClose(function () { setConnection("err", "切断"); });

        relay = registerElSystemaInstrument({
          id: id,
          transport: transport,
          audioContext: ac,
          outputNode: master,
          play: function () {
            logReceived("play", {});
            noiseOn();
          },
          stop: function () {
            logReceived("stop", {});
            noiseOff();
          },
          setParam: function (name, value) {
            logReceived("setParam", { name: name, value: value });
            setParam(name, value);
          },
          ramp: function (name, from, to, durMs) {
            logReceived("ramp", { name: name, from: from, to: to, durMs: durMs });
            if (inflightRamps[name]) cancelAnimationFrame(inflightRamps[name]);
            setParam(name, from);
            const start = performance.now();
            const span = durMs <= 0 ? 0 : durMs;
            if (!span) {
              setParam(name, to);
              delete inflightRamps[name];
              return;
            }
            function step(now) {
              const t = Math.min(1, (now - start) / span);
              setParam(name, from + (to - from) * t);
              if (t < 1) {
                inflightRamps[name] = requestAnimationFrame(step);
              } else {
                delete inflightRamps[name];
              }
            }
            inflightRamps[name] = requestAnimationFrame(step);
          },
          loadPreset: function (preset) {
            logReceived("loadPreset", preset);
            Object.keys(preset || {}).forEach(function (key) {
              setParam(key, preset[key]);
            });
          },
          snapshot: function () {
            logReceived("snapshot", {});
            return makeSnapshot();
          },
        });

        if (!kehaiPoll) {
          kehaiPoll = setInterval(function () {
            if (!relay || typeof relay.getKehai !== "function") return;
            const k = relay.getKehai();
            const pct = Math.round((k.presence || 0) * 100);
            presenceBar.style.width = pct + "%";
            presenceText.textContent = (k.presence || 0).toFixed(3);
            kehaiSim.textContent = (noiseSrc ? "●sim" : "○sim") + " everSpoke=" + (k.everSpoke ? "true" : "false");
            refreshSnapshot();
          }, 180);
        }

        setConnection("off", "接続待ち");
        updateAudioState();
        refreshSnapshot();
      }

      async function unlockAudio() {
        ensureAudio();
        if (ac.state !== "running") await ac.resume();
        updateAudioState();
      }

      function noiseOn() {
        ensureAudio();
        if (ac.state !== "running") {
          ac.resume().catch(function () {});
        }
        if (noiseSrc) return;
        const buf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.9;
        noiseSrc = ac.createBufferSource();
        noiseSrc.buffer = buf;
        noiseSrc.loop = true;
        noiseSrc.connect(voiceGain);
        noiseSrc.start();
        noiseSrc.onended = function () {
          if (noiseSrc) noiseSrc.disconnect();
          noiseSrc = null;
          updateAudioState();
          refreshSnapshot();
        };
        updateAudioState();
        refreshSnapshot();
      }

      function noiseOff() {
        if (!noiseSrc) return;
        try { noiseSrc.stop(); } catch (_) {}
        try { noiseSrc.disconnect(); } catch (_) {}
        noiseSrc = null;
        updateAudioState();
        refreshSnapshot();
      }

      function makeSnapshot() {
        const kehai = relay && typeof relay.getKehai === "function"
          ? relay.getKehai()
          : { presence: 0, low: 0, high: 0, everSpoke: false, lastSpokeAt: 0 };
        return {
          id: id,
          playing: !!noiseSrc,
          audioState: ac ? ac.state : "none",
          params: Object.assign({}, params),
          everSpoke: !!kehai.everSpoke,
          lastSpokeAt: kehai.lastSpokeAt || 0,
          presence: +(kehai.presence || 0).toFixed(4),
          low: +(kehai.low || 0).toFixed(4),
          high: +(kehai.high || 0).toFixed(4),
          receivedCount: received.length,
        };
      }

      masterGainEl.addEventListener("input", function () {
        setMaster(masterGainEl.value);
        refreshSnapshot();
      });
      cutoffEl.addEventListener("input", function () {
        setCutoff(cutoffEl.value);
        refreshSnapshot();
      });
      noiseLevelEl.addEventListener("input", function () {
        setNoiseLevel(noiseLevelEl.value);
        refreshSnapshot();
      });

      document.getElementById("unlockBtn").addEventListener("click", function () {
        unlockAudio().catch(function (e) {
          setConnection("err", "audio err");
          console.error(e);
        });
      });
      document.getElementById("startBtn").addEventListener("click", function () {
        unlockAudio().then(noiseOn).catch(console.error);
      });
      document.getElementById("stopBtn").addEventListener("click", noiseOff);

      setMaster(masterGainEl.value);
      setCutoff(cutoffEl.value);
      setNoiseLevel(noiseLevelEl.value);
      refreshSnapshot();
    })();
  </script>
</body>
</html>
