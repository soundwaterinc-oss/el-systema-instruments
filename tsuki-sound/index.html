<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TSUKI — 植物細胞・月楽器</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0d1b2a; overflow: hidden;
        font-family: "Hiragino Kaku Gothic ProN", "Helvetica Neue", system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #start {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 1.2rem;
        background: radial-gradient(circle at 50% 40%, #16243a 0%, #0d1b2a 70%);
        color: #cfd8e3; z-index: 50; cursor: pointer; text-align: center;
      }
      #start h1 { font-weight: 200; letter-spacing: 0.5em; margin: 0; font-size: 2.4rem; }
      #start .sub { color: #9fd6b0; letter-spacing: 0.25em; font-size: 0.8rem; }
      #start .hint { color: #5b7185; font-size: 0.75rem; letter-spacing: 0.15em; }
      .moon { width: 92px; height: 92px; border-radius: 50%;
        background: radial-gradient(circle at 38% 35%, #eaf1f6, #9fb3c4 60%, #4a6075 100%);
        box-shadow: 0 0 60px 8px rgba(159,214,176,0.25); }
    </style>
    <script type="module" crossorigin src="./assets/index-cppuSxtb.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="start">
      <div class="moon"></div>
      <h1>月</h1>
      <div class="sub">TSUKI · PLANT-CELL LUNAR INSTRUMENT</div>
      <div class="hint">tap / click to breathe &nbsp;—&nbsp; タップで起動</div>
    </div>
    <script src="./shared/el-systema-shapes.js"></script>
    <script src="./shared/el-systema-transport.js"></script>
    <script src="./shared/el-systema-control.js"></script>
  </body>
</html>
